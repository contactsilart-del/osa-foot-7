# ============================================================
#  OSA FOOT 7 — configuration Cloudflare Pages
#
#  ⚠ Ce fichier fait autorité : tant qu'il est présent à la racine,
#    Cloudflare IGNORE les bindings ajoutés depuis Settings → Bindings
#    du dashboard. Les identifiants ci-dessous sont donc les seuls pris
#    en compte.
#
#  ⚠ Les SECRETS ne se mettent JAMAIS ici. ADMIN_PASSWORD et
#    SESSION_SECRET se définissent dans le dashboard
#    (Settings → Variables and Secrets, type « Secret »)
#    ou via : npx wrangler pages secret put ADMIN_PASSWORD
#
#  Les identifiants ci-dessous ne sont pas sensibles : ce sont de
#  simples références, inutilisables sans accès au compte Cloudflare.
# ============================================================

name = "osa-foot-7"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# ── Production ───────────────────────────────────────────────

# Contenu du site + messages du formulaire de contact.
[[d1_databases]]
binding       = "DB"
database_name = "osa-foot-7"
database_id   = "d414086c-4259-4565-aa8b-84fd4518194a"

# Images téléversées depuis le panel d'administration.
[[kv_namespaces]]
binding = "MEDIA"
id      = "45ff3cc774754dc08cf2eddec43b79ce"

# ── Prévisualisation (branches autres que main) ───────────────
# Mêmes ressources que la production : suffisant pour un site de club.
# Pour isoler la préproduction, créez une seconde base et un second
# namespace, puis remplacez les identifiants ci-dessous.

[env.preview]

[[env.preview.d1_databases]]
binding       = "DB"
database_name = "osa-foot-7"
database_id   = "d414086c-4259-4565-aa8b-84fd4518194a"

[[env.preview.kv_namespaces]]
binding = "MEDIA"
id      = "45ff3cc774754dc08cf2eddec43b79ce"
